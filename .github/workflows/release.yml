name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            archive: zip
            binary: cadops.exe
          - goos: windows
            goarch: arm64
            archive: zip
            binary: cadops.exe
          - goos: linux
            goarch: amd64
            archive: tar.gz
            binary: cadops
          - goos: linux
            goarch: arm64
            archive: tar.gz
            binary: cadops
          - goos: darwin
            goarch: amd64
            archive: tar.gz
            binary: cadops
          - goos: darwin
            goarch: arm64
            archive: tar.gz
            binary: cadops

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          out_dir="dist/cadops-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$out_dir"
          version="${GITHUB_REF_NAME:-dev}"
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            version="dev"
          fi
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X github.com/cadops/cadops/internal/cli.version=${version} -X github.com/cadops/cadops/internal/cli.commit=${GITHUB_SHA::7} -X github.com/cadops/cadops/internal/cli.date=${build_date}"
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" go build -ldflags "$ldflags" -o "$out_dir/${{ matrix.binary }}" ./cmd/cadops
          cp README.md LICENSE "$out_dir/"

      - name: Package zip archive
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          archive="cadops-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          zip -r "$archive" "cadops-${{ matrix.goos }}-${{ matrix.goarch }}"
          sha256sum "$archive" > "$archive.sha256"

      - name: Package tar.gz archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          archive="cadops-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czf "$archive" "cadops-${{ matrix.goos }}-${{ matrix.goarch }}"
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: cadops-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/cadops-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}
            dist/cadops-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}.sha256

      - name: Publish release archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Download the archive for your operating system and CPU architecture, extract it, and put the `cadops` binary on your `PATH`.

            CadOps requires Git and Git LFS on the target machine. Run `cadops version` and `cadops doctor` after installation to verify the binary and repository setup.
          files: |
            dist/cadops-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}
            dist/cadops-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}.sha256
